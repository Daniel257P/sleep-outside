<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/product_listing.js" type="module"></script>
  </head>
 <body>
    <header class="divider" id="main-header">
    </header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>
      <div class="category-icons">
        <a href="./index.html?category=tents">
          <img src="images/category-tents.svg" alt="Tents" />
        </a>
        <a href="./index.html?category=sleeping-bags">
          <img src="images/category-sleeping-bags.svg" alt="Sleeping Bags" />
        </a>
        <a href="./index.html?category=backpacks">
          <img src="images/category-backpacks.svg" alt="Backpacks" />
        </a>
        <a href="./index.html?category=hammocks">
          <img src="images/category-hammocks.svg" alt="Hammocks" />
        </a>
      </div>
      <section class="products">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2>Top Products:<span class="category-title"></span></h2>
          <div>
            <label for="sort-control" style="margin-right: 0.5rem;">Sort by:</label>
            <select id="sort-control" style="padding: 0.5rem;">
              <option value="">Default</option>
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
              <option value="price-asc">Price (Low to High)</option>
              <option value="price-desc">Price (High to Low)</option>
            </select>
          </div>
        </div>
        <ul class="product-list">
            <!-- Product cards will be rendered here by JavaScript -->
        </ul>
      </section>
    </main>
    <footer id="main-footer">
    </footer>
  </body>
</html>
